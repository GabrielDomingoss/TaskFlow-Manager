services:
  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: